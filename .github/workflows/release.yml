name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: launchline_windows_amd64.exe
          - goos: windows
            goarch: arm64
            artifact: launchline_windows_arm64.exe
          - goos: linux
            goarch: amd64
            artifact: launchline_linux_amd64
          - goos: linux
            goarch: arm64
            artifact: launchline_linux_arm64
          - goos: darwin
            goarch: amd64
            artifact: launchline_darwin_amd64
          - goos: darwin
            goarch: arm64
            artifact: launchline_darwin_arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath
          -ldflags="-s -w
          -X github.com/launchline/launchline/cmd.Version=${GITHUB_REF_NAME}
          -X github.com/launchline/launchline/cmd.Commit=${GITHUB_SHA}
          -X github.com/launchline/launchline/cmd.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -o "dist/${{ matrix.artifact }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
